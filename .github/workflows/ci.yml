# CI runs only on synthetic fixtures generated by the tests. Private-sample tests skip
# themselves because their environment variables are never set here.
name: ci

on:
  push:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private drill data in tracked files
        run: sh scripts/check-private-data.sh --tracked

  test:
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p three-du-cli -p three-du-ffi
