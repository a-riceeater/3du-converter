[workspace]
resolver = "2"
members = [
    "crates/three-du-core",
    # "crates/three-du-openmarch",
    # "crates/three-du-fieldwork",
    # "crates/three-du-cli",
    # "crates/three-du-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a-riceeater/3du-converter"
rust-version = "1.75"

[workspace.dependencies]
three-du-core = { path = "crates/three-du-core" }
three-du-openmarch = { path = "crates/three-du-openmarch" }
three-du-fieldwork = { path = "crates/three-du-fieldwork" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
crc32fast = "1"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
